<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">    
    <title>Simulador de Likes</title>
</head>
<body>
    <!--Campo para ingresar título-->
    <div class="input-group mb-2">
        <span class="input-group-text" id="span-titulo">Título</span>
        <input type="text" class="form-control" id="titulo" placeholder="Ingresa el título" aria-label="titulo" aria-describedby="basic-addon1">
    </div>
    <!--Campo para ingresar descripción-->
    <div class="input-group mb-2">
        <span class="input-group-text" id="span-descripcion">Descripción</span>
        <textarea class="form-control" id="descripcion" rows="3" placeholder="Ingresa la descripción"></textarea>
    </div>    
    <!--Campo para ingresar archivo-->
    <div class="input-group mb-2">
        <input class="form-control" type="file" id="archivo">
    </div>    
    <div class="input-group mb-2">
        <button type="submit" class="btn btn-primary" onclick="publicarCard()">Publicar</button>
    </div>    
    <!-- Contador de cards -->
    <div class="row mb-3">
        <div class="col text-center">
            <h5>Publicaciones creadas: <span id="contador" class="badge bg-success">0</span></h5>
        </div>
    </div>
    <!-- Contenedor de cards generadas -->
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" id="cardsContainer">
    </div>    
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
